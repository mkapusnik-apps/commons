name: Validate Semantic Release (Pull Request)

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  declaration:
    name: Validate release declaration
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate semantic release declaration and classification
        run: >-
          node .github/scripts/semantic-release.js validate
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
