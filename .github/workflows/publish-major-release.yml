name: Publish Major Release

run-name: Publish next major at ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full SHA of the current master revision
        required: true
        type: string
      confirmation:
        description: Enter PUBLISH NEXT MAJOR AT followed by the target SHA
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: semantic-release-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish next major release
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out target revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Derive and publish next major
        uses: actions/github-script@v9
        env:
          RELEASE_TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        with:
          github-token: ${{ github.token }}
          script: |
            const semanticRelease = require(
              './.github/scripts/semantic-release.js',
            );
            await semanticRelease.publishMajor({ github, context, core });
