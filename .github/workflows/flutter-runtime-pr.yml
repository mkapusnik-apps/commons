name: Build Flutter runtimes (PR)

on:
  pull_request:
    branches: [master]
    paths:
      - runtimes/flutter/*.Dockerfile
      - .github/workflows/flutter-runtime-pr.yml
      - .github/workflows/flutter-runtime-publish.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Resolve latest stable Flutter once
        id: flutter
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json |
            jq -er '. as $index | .releases[] |
              select(.hash == $index.current_release.stable and .channel == "stable" and
                (.dart_sdk_arch // "x64") == "x64") |
              "url=\($index.base_url)/\(.archive)\nsha256=\(.sha256)\nversion=\(.version)\nrevision=\(.hash)"' \
              >> "$GITHUB_OUTPUT"
      - name: Build slim
        run: |
          docker build --builder default --platform linux/amd64 --pull --no-cache \
            --file runtimes/flutter/slim.Dockerfile --tag commons-flutter:slim \
            --build-arg FLUTTER_URL="${{ steps.flutter.outputs.url }}" \
            --build-arg FLUTTER_SHA256="${{ steps.flutter.outputs.sha256 }}" \
            --build-arg FLUTTER_VERSION="${{ steps.flutter.outputs.version }}" \
            --build-arg FLUTTER_REVISION="${{ steps.flutter.outputs.revision }}" \
            --build-arg SOURCE_REVISION="${{ github.event.pull_request.head.sha }}" \
            runtimes/flutter
      - name: Build full from this run's slim
        run: |
          docker build --builder default --platform linux/amd64 --no-cache \
            --file runtimes/flutter/full.Dockerfile --tag commons-flutter:full \
            --build-arg SLIM_IMAGE=commons-flutter:slim runtimes/flutter
