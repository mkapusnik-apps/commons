name: Refresh Flutter runtimes

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - runtimes/flutter/**
      - .github/workflows/flutter-runtimes.yml

permissions:
  contents: read

concurrency:
  group: flutter-runtime-publication
  cancel-in-progress: false

jobs:
  refresh:
    # Same-repository PRs may publish validated unique candidates, never floats.
    # Do not expose a package-write token to fork code.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/mkapusnik-apps/commons/flutter
      PUBLICATION: run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - name: Resolve official inputs once
        id: resolve
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/flutter-resolution" "$RUNNER_TEMP/flutter-evidence"
          docker pull --platform linux/amd64 ubuntu:24.04
          base=$(docker image inspect ubuntu:24.04 --format '{{index .RepoDigests 0}}')
          python3 runtimes/flutter/resolve.py "$base" > "$RUNNER_TEMP/flutter-resolution/resolved.json"
          cp "$RUNNER_TEMP/flutter-resolution/resolved.json" "$RUNNER_TEMP/flutter-evidence/"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Build lightweight candidate
        uses: docker/build-push-action@v7
        with:
          context: runtimes/flutter
          build-contexts: resolution=${{ runner.temp }}/flutter-resolution
          target: lightweight
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.PUBLICATION }}-lightweight
          build-args: |
            BASE_IMAGE=${{ steps.resolve.outputs.base }}
            REFRESH_ID=${{ env.PUBLICATION }}
            SOURCE_REVISION=${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build full candidate
        uses: docker/build-push-action@v7
        with:
          context: runtimes/flutter
          build-contexts: resolution=${{ runner.temp }}/flutter-resolution
          target: full
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.PUBLICATION }}-full
          build-args: |
            BASE_IMAGE=${{ steps.resolve.outputs.base }}
            REFRESH_ID=${{ env.PUBLICATION }}
            SOURCE_REVISION=${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate the candidate pair
        shell: bash
        run: |
          echo "build_seconds=$(( $(date +%s) - ${{ steps.resolve.outputs.started }} ))" > "$RUNNER_TEMP/flutter-evidence/timing.txt"
          # Developer-owned workload hook. Missing hook fails closed before login/push.
          bash runtimes/flutter/validate.sh \
            "$IMAGE:$PUBLICATION-lightweight" "$IMAGE:$PUBLICATION-full" \
            "$RUNNER_TEMP/flutter-evidence"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated unique pair
        shell: bash
        run: |
          for variant in lightweight full; do
            ref="$IMAGE:$PUBLICATION-$variant"
            docker push "$ref"
            digest=$(docker image inspect "$ref" --format '{{index .RepoDigests 0}}')
            printf '%s=%s\n' "$variant" "$digest" >> "$RUNNER_TEMP/flutter-evidence/pair.env"
          done
          cat "$RUNNER_TEMP/flutter-evidence/pair.env" >> "$GITHUB_STEP_SUMMARY"
      - name: Advance validated floating references
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          source "$RUNNER_TEMP/flutter-evidence/pair.env"
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:lightweight" "$lightweight"
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:full" "$full"
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-${{ env.PUBLICATION }}
          path: ${{ runner.temp }}/flutter-evidence
          if-no-files-found: warn
