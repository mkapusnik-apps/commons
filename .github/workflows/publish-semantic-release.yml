name: Publish Semantic Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: semantic-release-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pushed revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Publish changed action content
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const semanticRelease = require(
              './.github/scripts/semantic-release.js',
            );
            await semanticRelease.publishPatch({ github, context, core });
