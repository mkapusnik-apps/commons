name: Validate GitHub Actions

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/actions/**/action.yml
  push:
    branches:
      - master
    paths:
      - .github/actions/**/action.yml

permissions:
  contents: read

jobs:
  yaml-syntax:
    name: Validate action YAML syntax
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Require standalone action metadata
        shell: bash
        run: |
          shopt -s globstar nullglob
          action_files=(.github/actions/**/action.yml)
          if (( ${#action_files[@]} == 0 )); then
            echo "::error::No files matched .github/actions/**/action.yml"
            exit 1
          fi

      - name: Validate YAML syntax
        uses: GrantBirki/json-yaml-validate@v5
        with:
          files: .github/actions/**/action.yml
          use_gitignore: 'false'

  action-metadata-schema:
    name: Validate action metadata schema
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate action.yml metadata
        uses: cardinalby/schema-validator-action@v3
        with:
          file: .github/actions/**/action.yml
          fileParser: yaml
          schema: https://raw.githubusercontent.com/SchemaStore/schemastore/d9d98e69894ebd7a50965dc58d61951e9d7f23a7/src/schemas/json/github-action.json
