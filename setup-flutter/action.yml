name: Setup Flutter for CI
description: Install and configure the project-wide stable Flutter toolchain.

inputs:
  additional-android-packages:
    description: >-
      Additional whitespace-separated Android SDK package identifiers
      to install.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Free disk space for Android build
      uses: AdityaGarg8/remove-unwanted-software@v5
      with:
        remove-dotnet: true
        remove-haskell: true
        remove-codeql: true
        remove-docker-images: true

    - name: Setup Java SDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'

    - name: Normalize Android SDK packages
      shell: bash
      env:
        ADDITIONAL_ANDROID_PACKAGES: ${{ inputs.additional-android-packages }}
      run: |
        packages='tools platform-tools platforms;android-36 build-tools;36.0.0'
        additional_packages="$(
          printf '%s' "$ADDITIONAL_ANDROID_PACKAGES" |
            LC_ALL=C tr -s '[:space:]' ' ' |
            sed 's/^ //; s/ $//'
        )"
        if [[ -n "$additional_packages" ]]; then
          packages+=" $additional_packages"
        fi
        printf 'SETUP_FLUTTER_ANDROID_PACKAGES=%s\n' "$packages" >> "$GITHUB_ENV"

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: ${{ env.SETUP_FLUTTER_ANDROID_PACKAGES }}

    - name: Setup Flutter SDK
      uses: subosito/flutter-action@v2
      env:
        PUB_CACHE: "${{ runner.temp }}/flutter-pub-cache"
      with:
        channel: stable
        cache: true
        pub-cache: true
        cache-path: "${{ runner.temp }}/flutter-sdk/:channel:-:version:-:arch:"
        pub-cache-path: "${{ runner.temp }}/flutter-pub-cache"

    - name: Configure Flutter CLI for CI
      shell: bash
      run: |
        git config --global --add safe.directory "$FLUTTER_ROOT"
        flutter --suppress-analytics config --no-analytics --no-cli-animations
