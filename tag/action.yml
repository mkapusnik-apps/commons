name: Set Git Tag

description: |
  Create or update a lightweight or annotated Git tag pointing to a given commit SHA.
  Useful for marking builds like "sanity", "latest", etc.

inputs:
  tag:
    description: Tag name to create or update (without refs/tags/ prefix)
    required: true
  commit_sha:
    description: Commit SHA to tag. Defaults to context.sha.
    required: false
  message:
    description: Annotation message. Empty creates a lightweight tag; whitespace is preserved.
    required: false
    default: ''
  create-only:
    description: Fail if the tag already exists instead of updating it.
    required: false
    default: 'false'
  token:
    description: GitHub token used for ref operations (use PAT to trigger downstream workflows).
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Set tag "${{ inputs.tag }}" to SHA
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.token }}
        script: |
          const tag = (process.env.TAG_NAME ?? '').trim();
          if (!tag) throw new Error('Input "tag" must be a non-empty string');

          const props = {
            owner: context.repo.owner,
            repo: context.repo.repo,
          };

          const sha = (process.env.TAG_COMMIT_SHA ?? '').trim() || context.sha;
          const message = process.env.TAG_MESSAGE ?? '';
          const createOnly = (process.env.TAG_CREATE_ONLY ?? 'false').trim().toLowerCase() === 'true';
          const ref = `refs/tags/${tag}`;
          const apiRef = `tags/${tag}`;

          const describeError = (error) => {
            const status = error.status ? `${error.status} ` : '';
            const url = error.documentation_url ? ` (${error.documentation_url})` : '';
            return `${status}${error.message}${url}`;
          };

          let exists = false;

          try {
            await github.rest.git.getRef({ ...props, ref: apiRef });
            exists = true;
          } catch (error) {
            if (error.status !== 404) {
              throw new Error(`Failed to look up ${ref}: ${describeError(error)}`);
            }
          }

          if (exists && createOnly) {
            throw new Error(`Tag ${ref} already exists; create-only does not update existing tags`);
          }

          let refSha = sha;
          if (message !== '') {
            try {
              const { data } = await github.rest.git.createTag({
                ...props, tag, message, object: sha, type: 'commit',
              });
              refSha = data.sha;
            } catch (error) {
              throw new Error(`Failed to create annotation for ${ref}: ${describeError(error)}`);
            }
          }

          if (exists) {
            core.info(`Updating ${ref} to ${sha}`);
            try {
              await github.rest.git.updateRef({ ...props, ref: apiRef, sha: refSha, force: true });
            } catch (error) {
              throw new Error(`Failed to update ${ref}: ${describeError(error)}`);
            }
            core.info(`Updated ${ref} to ${sha}`);
          } else {
            core.info(`Creating ${ref} at ${sha}`);
            try {
              await github.rest.git.createRef({ ...props, ref, sha: refSha });
            } catch (error) {
              throw new Error(`Failed to create ${ref}: ${describeError(error)}`);
            }
            core.info(`Created ${ref} at ${sha}`);
          }
      env:
        TAG_NAME: ${{ inputs.tag }}
        TAG_COMMIT_SHA: ${{ inputs.commit_sha }}
        TAG_MESSAGE: ${{ inputs.message }}
        TAG_CREATE_ONLY: ${{ inputs.create-only }}
